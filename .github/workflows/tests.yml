name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[api,dev]"

      - name: Run unit and API tests
        run: pytest -q -m "not browser"

  quality:
    name: Lint and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality dependencies
        run: python -m pip install -e ".[api,dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Build distribution
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Smoke-test installed wheel
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/wheel-smoke/bin/shopify-audit" version
          "${RUNNER_TEMP}/wheel-smoke/bin/shopify-audit" demo \
            --output-dir "${RUNNER_TEMP}/shopify-auditor-demo"

  browser:
    name: Chromium smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[api,dev]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run real-browser smoke test
        run: pytest -q -m browser

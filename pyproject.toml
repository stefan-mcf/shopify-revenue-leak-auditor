[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopify-revenue-leak-auditor"
version = "0.1.0"
description = "Browser-based Shopify audit tool that generates client-ready ecommerce revenue leak reports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Stefan McFeeters"}]
keywords = ["shopify", "ecommerce", "audit", "cro", "playwright"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "beautifulsoup4>=4.12",
  "playwright>=1.44",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]
dev = [
    "build>=1.2",
    "httpx2>=2.7",
    "pytest>=8.0",
    "ruff>=0.9",
    "twine>=5.1",
]

[project.scripts]
shopify-audit = "shopify_auditor.cli:app"
shopify-audit-api = "shopify_auditor.api:main"

[project.urls]
Repository = "https://github.com/stefan-mcf/shopify-revenue-leak-auditor"
Issues = "https://github.com/stefan-mcf/shopify-revenue-leak-auditor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shopify_auditor = ["demo_product_page.html", "reports/templates/*.html", "reports/templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "browser: requires an installed Playwright Chromium browser",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
ignore = ["E501", "RUF001", "UP042"]
